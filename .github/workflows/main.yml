name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: master

      - name: Run zig fmt
        if: matrix.os == 'ubuntu-latest'
        run: zig fmt --check .

      - name: Run zig build check test
        run: zig build check test --summary all

      - name: Setup wasmtime
        if: matrix.os == 'ubuntu-latest'
        run: |
          WASMTIME_VERSION=v50.0.1
          wget https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-musl.tar.xz
          echo "2ddfcfaf8d859ae84a618d7a52f01c5d0d0fa5ae323bf758fb3a376129de5746  wasmtime-${WASMTIME_VERSION}-x86_64-musl.tar.xz" | sha256sum --check
          tar -xf wasmtime-${WASMTIME_VERSION}-x86_64-musl.tar.xz --directory wasmtime-${WASMTIME_VERSION}-x86_64-musl/wasmtime
          echo "${PWD}/wasmtime-${WASMTIME_VERSION}-x86_64-musl/wasmtime" >> $GITHUB_PATH
          wasmtime --version

      - name: Run zig build check test -Dtarget=wasm32-wasi
        if: matrix.os == 'ubuntu-latest'
        run: zig build check test -Dtarget=wasm32-wasi -fwasmtime --summary all
