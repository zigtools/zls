name: Code Coverage

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  coverage:
    if: github.repository_owner == 'zigtools'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: master

      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install patchelf
          wget https://github.com/SimonKagstrom/kcov/releases/download/v42/kcov-amd64.tar.gz
          echo "78aa17a5f6d27a867cc0540b1550051591d350423a1a0ef98d63c9ce7cc10f9d  kcov-amd64.tar.gz" | sha256sum --check
          sudo tar xf kcov-amd64.tar.gz -C /
          sudo patchelf --replace-needed libopcodes-2.38-system.so libopcodes-2.42-system.so --replace-needed libbfd-2.38-system.so libbfd-2.42-system.so $(which kcov)

      - name: Run Tests with kcov
        run: |
          kcov --version
          zig build test -Dcoverage -Duse-llvm --summary all

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: zig-out/coverage/kcov-merged
          fail_ci_if_error: true
          verbose: true
